[package]
name = "vry-rust"
version = "3.0.0"
description = "VALORANT rank yoinker - Tauri rewrite"
authors = ["idkwhoiam322"]
edition = "2021"
license = "MIT"
repository = "https://github.com/idkwhoiam322/VALORANT-rank-yoinker"
readme = "../README.md"
keywords = ["valorant", "tauri", "overlay", "tracker"]
categories = ["game", "gui"]

[lib]
name = "vry_rust_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
tokio = { version = "=1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4" }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
lru = "0.12"

[lints.clippy]
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
upper_case_acronyms = "allow"
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
let_and_return = "allow"
needless_borrow = "allow"
useless_borrows_in_formatting = "allow"
double_ended_iterator_last = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_map_or = "allow"
redundant_pattern_matching = "allow"
if_same_then_else = "allow"
bind_instead_of_map = "allow"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = "none"

[profile.release-max]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
inherits = "release"
